[package]
name = "navplayer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
dirs = "6"
eframe = "0.33"
egui = "0.33"
libloading = "0.8"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-core = "0.61"

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
